<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sensei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f3f4f7; --sheet:#ffffff; --sheet2:#e9ecf1; --rule:#d5dae3; --rule2:#b9c1ce;
  --ink:#171c26; --ink2:#4d5666; --ink3:#7d8696;
  --acc:#3452a3; --accbg:#e6ebf8;
  --ok:#1f6f47; --okbg:#e3f3ea; --bad:#b23a2f; --badbg:#fbe9e6; --warn:#8a5a00; --warnbg:#fbf1dc;
  --add:#e9f7ec;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#0f131a; --sheet:#161b24; --sheet2:#1d232e; --rule:#2a3140; --rule2:#3a4354;
  --ink:#e4e8ef; --ink2:#a4adbc; --ink3:#6f7889;
  --acc:#93adff; --accbg:#1c2540;
  --ok:#7fd39a; --okbg:#15271d; --bad:#f08a7e; --badbg:#2c1a18; --warn:#e6b45a; --warnbg:#2a2214;
  --add:#17281c;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);padding-bottom:56px}
a{color:var(--acc)}
code,kbd{font-family:var(--mono);font-size:.92em}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}footer{left:0}}

/* ---------- sidebar: the course ---------- */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--sheet);border-right:1px solid var(--rule);padding:18px 18px 70px;display:flex;flex-direction:column;gap:22px}
.side h1{margin:0;font:600 15px/1.2 var(--sans)}
.side h1 small{display:block;color:var(--ink3);font-weight:400;font-size:12px;margin-top:3px}
.lbl{font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lbl .r{margin-left:auto;font:11px var(--mono);letter-spacing:0;text-transform:none}
.meter{height:5px;background:var(--sheet2);border-radius:3px;overflow:hidden;display:flex;margin:0 0 10px}
.meter i{display:block;height:100%}
.meter .a{background:var(--ok)}.meter .b{background:var(--acc)}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:grid;grid-template-columns:14px 1fr;gap:9px;align-items:start;padding:5px 0;font-size:12.5px;line-height:1.35;color:var(--ink2);border-bottom:1px solid var(--rule)}
.ladder li:last-child{border-bottom:0}
.ladder .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule2);margin-top:4px}
.ladder .dot.introduced{border-color:var(--acc);background:var(--sheet)}
.ladder .dot.practiced{border-color:var(--acc);background:var(--acc)}
.ladder .dot.fluent{border-color:var(--ok);background:var(--ok)}
.ladder .dot.rusty{border-color:var(--warn);background:var(--warnbg)}
.ladder .dot.today{box-shadow:0 0 0 3px var(--accbg)}
.ladder li.today{color:var(--ink);font-weight:500}
.ladder .n{font:11px var(--mono);color:var(--ink3);margin-right:5px}
.ladder .more{color:var(--ink3);font-size:12px;padding-top:7px;display:block}
.cap{background:var(--sheet2);border-radius:8px;padding:11px 12px;font-size:12.5px;color:var(--ink2)}
.cap b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.cap .path{display:block;font:11.5px var(--mono);color:var(--ink3);margin:6px 0 4px;word-break:break-all}
.cap .st{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font:11.5px var(--mono);color:var(--ink3)}
.cap .st i{width:7px;height:7px;border-radius:50%;background:var(--rule2)}
.cap .st i.on{background:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--rule);border-radius:8px;padding:9px 10px}
.stat .v{font:500 17px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat .v.bad{color:var(--bad)}
.stat .k{font-size:11px;color:var(--ink3);margin-top:3px}
.sharp{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink2)}
.sharp li{display:flex;justify-content:space-between;padding:4px 0}
.sharp li span:last-child{font:11.5px var(--mono);color:var(--ink3)}
.empty{color:var(--ink3);font-size:12.5px;font-style:italic}

/* ---------- main column ---------- */
.main{min-width:0}
.hud{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:9px 40px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
@media(max-width:900px){.hud{padding:9px 18px}}
.hud .where b{color:var(--ink);font-weight:500}
.hud .box{margin-left:auto;display:flex;align-items:center;gap:12px}
.hud .clock{font:500 16px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.hud .clock.warn{color:var(--warn)}.hud .clock.over{color:var(--bad)}
.hud .bar{width:150px;height:4px;background:var(--sheet2);border-radius:2px;overflow:hidden}
.hud .bar i{display:block;width:0;height:100%;background:var(--acc);transition:width .4s linear}
.hud .bar i.warn{background:var(--warn)}.hud .bar i.over{background:var(--bad)}
.hud .phase{font:11.5px var(--mono);color:var(--acc);background:var(--accbg);padding:4px 8px;border-radius:99px}
.hud .save{font:11.5px var(--mono);color:var(--ink3)}.hud .save.on{color:var(--ok)}
.hud .offline{color:var(--bad);font-size:11.5px}
.doc{max-width:760px;padding:34px 40px 60px}
@media(max-width:900px){.doc{padding:24px 18px 60px}}
.eyebrow{font:500 11px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:0 0 12px}
h2.title{font:500 34px/1.12 var(--serif);letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.lede{font:italic 400 17px/1.5 var(--serif);color:var(--ink2);margin:0 0 26px;max-width:60ch}

/* sections */
section{position:relative;padding:20px 0 24px;border-top:1px solid var(--rule)}
section h3{font:600 20px/1.2 var(--serif);margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section h3 .sub{font:400 12.5px var(--sans);color:var(--ink3)}
section h3 .res{margin-left:auto;font:11.5px var(--mono);color:var(--ink3)}
section h3 .res.ok{color:var(--ok)}section h3 .res.bad{color:var(--bad)}
section.strip{padding:12px 0;cursor:pointer}
section.strip h3{margin:0;font-size:16px}
section.strip:hover h3{color:var(--acc)}
section.later{opacity:.5}
section.later h3{font-size:16px;margin:0}
.rail{display:flex;gap:8px;align-items:center;font:11px/1 var(--mono);color:var(--ink3);margin:0 0 8px}
.rail .side-of{padding:3px 7px;border-radius:4px;border:1px solid var(--rule2)}
.rail .side-of.in{color:var(--acc);border-color:var(--acc)}
.prose{font:400 17px/1.62 var(--serif);max-width:62ch}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin-bottom:5px}
.prose h4{font:600 17px/1.3 var(--serif);margin:18px 0 8px}
.prose blockquote{border-left:3px solid var(--acc);background:var(--accbg);padding:11px 14px;margin:14px 0;font-size:15.5px;border-radius:0 6px 6px 0}
.prose blockquote p{margin:0}
.outcomes{list-style:none!important;padding:0!important}
.outcomes li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.outcomes li::before{content:"";width:16px;height:16px;border:1.5px solid var(--rule2);border-radius:4px;margin-top:4px}
pre.code{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;overflow-x:auto;font:12.5px/1.6 var(--mono);margin:12px 0;white-space:pre}
.res-list{list-style:none!important;padding:0!important;display:grid;gap:6px}
.res-list li{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:start;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font:13.5px/1.45 var(--sans);margin:0}
.res-list .k{font:500 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding-top:4px}
.res-list .m{font:11.5px var(--mono);color:var(--ink3);padding-top:3px;white-space:nowrap}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px}

/* choice / quiz */
.qq{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:14px 16px;margin-bottom:12px}
.qq .stem{font:400 16px/1.45 var(--serif);margin:0 0 10px}
.qq .stem .n{font:11px var(--mono);color:var(--ink3);margin-right:8px}
.opts{display:grid;gap:5px}
.opt{display:flex;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 11px;color:var(--ink);font:13.5px/1.45 var(--sans);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt[disabled]{cursor:default;opacity:.6}
.opt .l{font:11px var(--mono);color:var(--ink3);padding-top:3px}
.opt.right{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--badbg);opacity:1}
.why{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule2);font-size:13px;color:var(--ink2)}
.verdictline{font-weight:600;margin-bottom:4px}
.verdictline.ok{color:var(--ok)}.verdictline.bad{color:var(--bad)}
.gate{font-size:13px;color:var(--ink2);margin-top:6px;padding:9px 12px;border-radius:6px;background:var(--sheet2)}
.gate b{font-family:var(--mono);font-weight:500}
.cold{background:var(--warnbg);border:1px solid var(--warn);border-radius:6px;padding:10px 13px;margin:0 0 14px;font-size:13.5px}
.cold b{display:block;font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}

/* kata */
.kata{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.kata .kh{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:14px 16px;font-size:13.5px;margin:0}
.kata .kh dt{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding-top:3px}
.kata .kh dd{margin:0}
.kata .run{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
@media(max-width:640px){.kata .run{grid-template-columns:1fr}}
.kata .run>div{padding:12px 16px;min-width:0}
.kata .run>div+div{border-left:1px solid var(--rule)}
.kata .run h4{margin:0 0 6px;font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.kata .run pre{margin:0;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.kata .run pre .out{color:var(--ink3)}
.kata .foot{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--sheet2);border-top:1px solid var(--rule);font:12.5px var(--mono)}
.path{font:12.5px var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:2px 7px;color:var(--ink2);display:inline-block;margin:2px 4px 2px 0}
.cons{margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.cons li{margin-bottom:3px}
.hint{display:inline-flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--ink3)}
.hint span{border:1px solid var(--rule2);border-radius:99px;padding:2px 8px}
.hint span.used{background:var(--sheet2);color:var(--ink2)}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:500 13px var(--sans);cursor:pointer}
button.p:hover{filter:brightness(1.08)}
button.s{background:transparent;color:var(--ink2);border:1px solid var(--rule2);border-radius:6px;padding:6px 11px;font:12.5px var(--sans);cursor:pointer}
button.s:hover{color:var(--ink);border-color:var(--acc)}

/* explain */
textarea,input[type=text]{width:100%;background:var(--sheet);color:var(--ink);border:1px solid var(--rule2);border-radius:6px;padding:9px 11px;font:15px/1.5 var(--serif);resize:vertical}
input[type=text]{font:13.5px var(--sans)}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
.conf{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.conf button{width:30px;height:28px;background:var(--sheet);border:1px solid var(--rule);border-radius:5px;color:var(--ink);font:12.5px var(--mono);cursor:pointer}
.conf button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.sol{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.sol.tagged{border-color:var(--acc)}
.sol h5{margin:0 0 4px;font:11px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.sol .tag{color:var(--acc)}
.sol pre{margin:0 0 8px;font:11.5px/1.55 var(--mono);white-space:pre-wrap;color:var(--ink)}
.sol .lbl{display:flex;gap:6px}.sol .lbl button{flex:1;font-size:12px;padding:5px}
.reveal{margin-top:12px;border-top:1px dashed var(--rule2);padding-top:12px}

/* log / tomorrow */
.three{margin:0 0 12px;padding-left:0;list-style:none}
.three li{padding:5px 0 5px 14px;border-left:2px solid var(--rule2);margin-bottom:6px;font-size:13.5px}
.three li b{color:var(--ink3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
.diffbox{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font:12px/1.65 var(--mono);white-space:pre-wrap;margin:10px 0;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0 0 12px}
.kv dt{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:4px}
.kv dd{margin:0}

/* review card */
.rev{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.9fr);gap:14px}
@media(max-width:860px){.rev{grid-template-columns:1fr}}
.file{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:12px;background:var(--sheet)}
.fhead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--sheet2);border-bottom:1px solid var(--rule);font:12.5px/1 var(--mono)}
.fhead .cnt{margin-left:auto;color:var(--acc);font-size:11.5px}
.hunk{padding:4px 12px;background:var(--sheet2);color:var(--ink3);font:11.5px/1.6 var(--mono);border-bottom:1px solid var(--rule)}
.ln{display:flex;font:12.5px/1.65 var(--mono);white-space:pre;position:relative;cursor:pointer}
.ln:hover{background:var(--accbg)}
.ln .g{flex:none;width:50px;text-align:right;padding:0 10px 0 6px;color:var(--ink3);user-select:none;border-right:1px solid var(--rule)}
.ln .s{flex:none;width:16px;text-align:center;color:var(--ok);user-select:none}
.ln .c{flex:1;padding-right:32px;overflow-x:auto}
.ln.add{background:var(--add)}.ln.add:hover{background:var(--accbg)}
.ln.has .g{color:var(--acc);font-weight:600}
.ln.has::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.ln .plus{position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:0;background:var(--acc);color:#fff;border:0;border-radius:4px;width:19px;height:19px;font:600 13px/1 var(--sans);cursor:pointer}
.ln:hover .plus{opacity:1}
.thread{background:var(--sheet2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 12px 10px 56px}
.ccard{background:var(--sheet);border:1px solid var(--rule);border-left:2px solid var(--acc);border-radius:6px;padding:9px 11px;margin-bottom:8px}
.ccard h4{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.ccard h4 .anchor{font:11px var(--mono);color:var(--ink3);font-weight:400}
.ccard h4 .x{margin-left:auto;background:none;border:0;color:var(--ink3);cursor:pointer;font-size:14px}
.ccard h4 .x:hover{color:var(--bad)}
.ccard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px}
.ccard dt{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.ccard dd{margin:0}
.ccard dd:empty::after{content:"— empty —";color:var(--bad);font-style:italic}
.comp{background:var(--sheet);border:1px solid var(--acc);border-radius:6px;padding:10px 11px}
.comp label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:8px 0 3px}
.comp label:first-of-type{margin-top:0}
.comp textarea{font:13.5px/1.5 var(--sans);min-height:0}
.comp .btns{display:flex;gap:8px;margin-top:10px}
.verdict{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.verdict label{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;background:var(--sheet)}
.verdict label:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.rside h5{margin:0 0 8px;font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.rside .item{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 9px;margin-bottom:4px;cursor:pointer;color:var(--ink);font:12.5px var(--sans)}
.rside .item:hover{border-color:var(--acc)}
.rside .item.bad{border-left:2px solid var(--bad)}
.rside .item .a{display:block;font:10.5px var(--mono);color:var(--ink3)}

/* check bar */
footer{position:fixed;left:272px;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);z-index:11}
footer .wrap{display:flex;align-items:center;gap:12px;padding:8px 40px;font:12.5px var(--mono)}
@media(max-width:900px){footer .wrap{padding:8px 18px}}
#out{color:var(--ink2);white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;max-height:3.2em}
#out .ok{color:var(--ok)}#out .bad{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"><h1>sensei <small>waiting for a session…</small></h1></aside>
  <div class="main">
    <div class="hud" id="hud"></div>
    <article class="doc" id="doc"><p class="empty">Waiting for a session…</p></article>
  </div>
</div>
<footer><div class="wrap">
  <button class="p" id="runcheck">run ./check</button>
  <span id="out">not run yet</span>
  <span class="offline" id="offline" hidden>server unreachable</span>
</div></footer>

<script>
"use strict";
/* The page is static. Everything below renders whatever .dojo/page.json says;
   the agent bumps `v` and we redraw. The lesson body comes from GET /lesson
   (the markdown file page.json names). Learner input goes to POST /commit and
   is replayed from GET /events on refresh, so reloading never loses work. */

let ST = {v:-1, cards:[], phase:null};
let LESSON = {path:null, md:""};
let A  = {};            /* answers, keyed "<cardId>:<slot>" */
let REV = {comments:[], verdict:null, next:1};
let openAt = null, manualOpen = null, lastOut = null;
let lessonOpen = {};    /* which lesson sections the learner expanded inside the box */

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = (id, slot) => A[id + ":" + slot];
const set = (id, slot, v) => { A[id + ":" + slot] = v; };

async function api(path, body){
  const o = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, o);
  if (!r.ok && r.status !== 403) throw new Error(path + " " + r.status);
  return r.json();
}
const commit = ev => api("/commit", ev).catch(() => {});

/* ── replay ─────────────────────────────────────────────────────────────── */
function replay(events){
  A = {}; REV = {comments:[], verdict:null, next:1};
  for (const e of events){
    if (e.kind === "choice" || e.kind === "predict") set(e.card, e.kind, e.pick);
    else if (e.kind === "quiz") set(e.card, "q" + e.item, e.pick);
    else if (e.kind === "confidence") set(e.card, "conf", e.value);
    else if (e.kind === "explain-text") set(e.card, "text", e.text);
    else if (e.kind === "label") set(e.card, "label:" + e.which, e.value);
    else if (e.kind === "review-state"){ REV.comments = e.comments || []; REV.verdict = e.verdict;
      REV.next = 1 + REV.comments.reduce((m,c) => Math.max(m, c.id||0), 0); }
    else if (e.kind === "check") lastOut = e;
  }
}

/* ── markdown (the lesson) ──────────────────────────────────────────────── */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  return s;
}
function md(src, opts){
  opts = opts || {};
  const lines = String(src || "").split("\n");
  let h = "", i = 0, para = [];
  const flush = () => { if (para.length){ h += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^```/.test(l)){
      flush(); let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; h += `<pre class="code">${esc(code.join("\n"))}</pre>`; continue;
    }
    if (/^#{1,4}\s/.test(l)){ flush(); h += `<h4>${inline(l.replace(/^#+\s*/, ""))}</h4>`; i++; continue; }
    if (/^>\s?/.test(l)){
      flush(); let q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      h += `<blockquote><p>${inline(q.join(" "))}</p></blockquote>`; continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      flush(); let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      if (opts.resources){
        h += `<ul class="res-list">` + items.map(it => {
          const parts = it.split(/\s+·\s+/);
          const kind = (parts[0] || "").replace(/\*\*/g, "");
          const rest = parts.slice(1); const min = /min$/.test(rest[rest.length-1] || "") ? rest.pop() : "";
          return `<li><span class="k">${esc(kind)}</span><div>${inline(rest.join(" · "))}</div><span class="m">${esc(min)}</span></li>`;
        }).join("") + `</ul>`;
      } else {
        h += `<ul class="${opts.outcomes ? "outcomes" : ""}">` + items.map(it => `<li>${inline(it)}</li>`).join("") + `</ul>`;
      }
      continue;
    }
    if (!l.trim()){ flush(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush();
  return h;
}
/* Split the lesson at its ## headings: {title, lede, sections:[{name, body}]} */
function lessonParts(src){
  const out = {title:"", lede:"", sections:[]};
  let cur = null, pre = [];
  for (const l of String(src || "").split("\n")){
    if (/^#\s/.test(l) && !out.title){ out.title = l.replace(/^#\s*/, ""); continue; }
    if (/^##\s/.test(l)){ cur = {name: l.replace(/^##\s*/, ""), lines: []}; out.sections.push(cur); continue; }
    (cur ? cur.lines : pre).push(l);
  }
  out.lede = pre.join("\n").trim();
  for (const s of out.sections) s.body = s.lines.join("\n");
  return out;
}

/* ── clock ──────────────────────────────────────────────────────────────── */
let startMs = null;
function tick(){
  const c = document.getElementById("clock"), f = document.getElementById("fill");
  if (!c || !f) return;
  const box = (ST.session_minutes || 20) * 60;
  if (ST.outside_box){ c.textContent = "outside the box"; c.className = "clock"; f.className = ""; f.style.width = "0"; return; }
  if (startMs == null){ c.textContent = "--:-- / " + String(box/60).padStart(2,"0") + ":00"; return; }
  const s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
  const mm = String(Math.floor(s/60)).padStart(2,"0"), ss = String(s%60).padStart(2,"0");
  c.textContent = `${mm}:${ss} / ${String(box/60).padStart(2,"0")}:00`;
  const late = s >= box, warn = s >= box * 0.75;
  c.className = "clock" + (late ? " over" : warn ? " warn" : "");
  f.className = late ? "over" : warn ? "warn" : "";
  f.style.width = Math.min(100, s / box * 100) + "%";
}
setInterval(tick, 1000);

       + (k.path ? `<span class="path">${esc(k.path)}</span>` : "")

       + `<div class="stat"><div class="v">${esc(a.days)} / ${esc(a.of || 7)}</div><div class="k">days present</div></div>`

/* ── HUD ────────────────────────────────────────────────────────────────── */
function hud(){
  startMs = ST.started_at ? Date.parse(ST.started_at) : null;
  const closes = startMs && !ST.outside_box ? new Date(startMs + (ST.session_minutes || 20) * 60000) : null;
  const hhmm = d => d.toTimeString().slice(0,5);
  let h = `<div class="where"><b>${ST.session_no ? "Session " + esc(ST.session_no) : "sensei"}</b>${ST.date ? " · " + esc(ST.date) : ""}</div>`;
  h += `<span class="phase">${esc(ST.outside_box ? "outside the box" : ST.phase ? ST.phase : "no session")}</span>`;
  if ((ST.writable || []).length) h += `<span class="save" id="save">${esc(ST.writable[0])} — saved</span>`;
  h += `<div class="box"><div class="bar"><i id="fill"></i></div><span class="clock" id="clock"></span>`
     + (closes ? `<span>closes ${hhmm(closes)}</span>` : "") + `</div>`;
  document.getElementById("hud").innerHTML = h;
  tick();
}

/* ── card bodies ────────────────────────────────────────────────────────── */
function choiceBody(c, slot, idPrefix){
  const pick = get(c.id, slot);
  let h = "";
  if (c.stem) h += `<p class="stem">${esc(c.stem)}</p>`;
  if (c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
  h += `<p class="stem">${idPrefix || ""}${esc(c.q)}</p><div class="opts">`;
  for (const o of c.opts || []){
    let cls = "opt";
    if (pick) cls += o.l === c.right ? " right" : (o.l === pick ? " wrong" : "");
    h += `<button class="${cls}" data-pick="${esc(c.id)}|${esc(slot)}|${esc(o.l)}" ${pick?"disabled":""}>`
       + `<span class="l">${esc(o.l)}</span><span>${esc(o.t)}</span></button>`;
  }
  h += `</div>`;
  if (pick){
    const ok = pick === c.right;
    h += `<div class="why"><div class="verdictline ${ok?"ok":"bad"}">`
       + esc(ok ? (c.hit_label || "hit") : (pick === c.near ? (c.near_label || "miss — the near miss") : "miss"))
       + `</div>${c.why || ""}</div>`;
  }
  return h;
}
function cChoice(c){
  return `<div class="qq">${choiceBody(c, "choice")}</div>`
       + (get(c.id, "choice") ? "" : `<p class="note">Commit to one. The answer does not exist on this page until you do.</p>`);
}
function quizScore(c){
  const items = c.items || [];
  let n = 0, done = 0;
  items.forEach((it, i) => { const p = get(c.id, "q" + (i+1)); if (p){ done++; if (p === it.right) n++; } });
  return {n, done, of: items.length};
}
function cQuiz(c){
  const items = c.items || [];
  let h = "";
  items.forEach((it, i) => {
    const q = Object.assign({}, it, {id: c.id});
    h += `<div class="qq">${choiceBody(q, "q" + (i+1), `<span class="n">${i+1}</span>`)}</div>`;
  });
  const s = quizScore(c);
  if (s.done === s.of && s.of){
    h += `<div class="gate"><b>${s.n} of ${s.of}</b> — ` + esc(c.no_gate
      ? "no lesson was assigned for today, so this score is logged and changes nothing."
      : (c.gate || (s.n >= 2 ? "the kata stays at full width." : "cold start: the kata narrows, and a narrowed kata cannot promote the concept."))) + `</div>`;
  } else {
    h += `<p class="note">${esc(c.no_gate ? "No lesson was assigned for today; the score is logged and does not narrow the kata." : (c.gate || "Two of three keeps the kata at full width. Fewer narrows it."))}</p>`;
  }
  return h;
}

function cKata(c){
  let h = "";
  if (c.narrowed) h += `<div class="cold"><b>narrower kata · cold start</b>${c.narrowed}</div>`;
  h += `<div class="kata"><dl class="kh">`;
  if (c.goal) h += `<dt>Goal</dt><dd>${esc(c.goal)}</dd>`;
  if (c.concept) h += `<dt>Concept</dt><dd>${esc(c.concept)}</dd>`;
  const files = c.files || (c.path ? [c.path] : []);
  if (files.length) h += `<dt>Open</dt><dd>` + files.map(f => `<span class="path">${esc(f)}</span>`).join("") + `</dd>`;
  if (c.done_when) h += `<dt>Done when</dt><dd>${esc(c.done_when)}</dd>`;
  h += `</dl>`;
  if (c.run || c.probe){
    h += `<div class="run">`;
    if (c.run) h += `<div><h4>${esc(c.run.running === false ? "Start the app" : "The app is running")}</h4><pre>$ ${esc(c.run.cmd)}${c.run.where ? `   <span class="out"># in ${esc(c.run.where)}</span>` : ""}${c.run.note ? `\n<span class="out">${esc(c.run.note)}</span>` : ""}</pre></div>`;
    if (c.probe) h += `<div><h4>Prove it by hand</h4><pre>$ ${esc(c.probe.cmd)}${c.probe.expect ? `\n<span class="out">→ ${esc(c.probe.expect)}</span>` : ""}</pre></div>`;
    h += `</div>`;
  }
  h += `<div class="foot"><button class="p" data-check="1">run ./check</button><span id="kout">${lastOut ? (lastOut.rc === 0 ? `<span style="color:var(--ok)">${esc(lastOut.out || "PASS")}</span>` : `<span style="color:var(--bad)">${esc((lastOut.out || "FAIL").split("\n")[0])}</span>`) : "not run yet"}</span></div></div>`;
  if (c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
  if ((c.constraints || []).length) h += `<ul class="cons">` + c.constraints.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>`;
  const hints = c.hints || ["a pointer", "a shape", "show me"];
  const used = c.hints_used || 0;
  h += `<div class="hint">Hint ladder ` + hints.map((t, i) => `<span class="${i < used ? "used" : ""}">${i+1} · ${esc(t)}</span>`).join("") + `</div>`;
  return h;
}

/* ── review card ────────────────────────────────────────────────────────── */
function parseDiff(raw){
  const out = {preamble:[], files:[]};
  let f = null, n = 0, seen = false;
  for (const l of String(raw || "").split("\n")){
    if (l.startsWith("diff --git ")){
      seen = true;
      const m = l.match(/ b\/(\S+)$/);
      f = {path: m ? m[1] : l, rows: []}; out.files.push(f); n = 0; continue;
    }
    if (!seen){ if (l.trim()) out.preamble.push(l); continue; }
    if (/^(index |new file mode|deleted file mode|similarity |rename |--- |\+\+\+ )/.test(l)) continue;
    const h = l.match(/^@@ -\S+ \+(\d+)(?:,\d+)? @@/);
    if (h){ n = +h[1]; if (f) f.rows.push({t:"hunk", text:l}); continue; }
    if (!f) continue;
    if (l.startsWith("+")) f.rows.push({t:"add", num:n++, text:l.slice(1)});
    else if (l.startsWith("-")) f.rows.push({t:"del", num:null, text:l.slice(1)});
    else if (l !== "") f.rows.push({t:"ctx", num:n++, text:l.replace(/^ /,"")});
  }
  return out;
}
const ckey = c => c.file + ":" + c.line;

function cReview(c){
  const D = parseDiff(c.diff);
  const valid = new Set();
  D.files.forEach(f => f.rows.forEach(r => { if (r.num) valid.add(f.path + ":" + r.num); }));
  if (REV.verdict == null) REV.verdict = (c.verdict || ["approve","request changes","comment"])[1];

  let left = "";
  if (D.preamble.length) left += `<p class="note" style="margin:0 0 10px">${esc(D.preamble.join(" · "))}</p>`;
  for (const f of D.files){
    const n = REV.comments.filter(x => x.file === f.path).length;
    left += `<div class="file"><div class="fhead"><span>${esc(f.path)}</span>`
          + `<span class="cnt">${n ? n + " comment" + (n>1?"s":"") : ""}</span></div>`;
    for (const r of f.rows){
      if (r.t === "hunk"){ left += `<div class="hunk">${esc(r.text)}</div>`; continue; }
      const k = f.path + ":" + r.num;
      const mine = r.num ? REV.comments.filter(x => ckey(x) === k) : [];
      left += `<div class="ln ${r.t==="add"?"add":""} ${mine.length?"has":""}" ${r.num?`data-k="${esc(k)}"`:""}>`
            + `<span class="g">${r.num || ""}</span><span class="s">${r.t==="add"?"+":r.t==="del"?"-":" "}</span>`
            + `<span class="c">${esc(r.text) || "&nbsp;"}</span>`
            + (r.num ? `<button class="plus" data-k="${esc(k)}">+</button>` : "") + `</div>`;
      if (mine.length || openAt === k){
        left += `<div class="thread">`;
        for (const x of mine) left += ccard(x);
        if (openAt === k) left += composer(k);
        left += `</div>`;
      }
    }
    left += `</div>`;
  }

  const vopts = c.verdict || ["approve","request changes","comment"];
  let right = `<h5>Verdict</h5><div class="verdict">`
    + vopts.map(v => `<label><input type="radio" name="verdict" value="${esc(v)}" ${REV.verdict===v?"checked":""}> ${esc(v)}</label>`).join("")
    + `</div><h5>Your comments (${REV.comments.length})</h5>`;
  right += REV.comments.length
    ? REV.comments.map(x => {
        const bad = !(x.what && x.why && x.fix) || !valid.has(ckey(x));
        return `<button class="item ${bad?"bad":""}" data-go="${esc(ckey(x))}">${esc(x.title||"(untitled)")}`
             + `<span class="a">${esc(x.file.split("/").pop())}:${x.line}</span></button>`;
      }).join("")
    : `<div class="empty">Click any line in the diff to comment on it.</div>`;

  return `<div class="rev"><div>${left}</div><div class="rside">${right}</div></div>`;
}
function ccard(x){
  return `<div class="ccard"><h4>${esc(x.title||"(untitled)")}`
    + `<span class="anchor">${esc(x.file.split("/").pop())}:${x.line}</span>`
    + `<button class="x" data-del="${x.id}">✕</button></h4>`
    + `<dl><dt>What</dt><dd>${esc(x.what)}</dd><dt>Why</dt><dd>${esc(x.why)}</dd>`
    + `<dt>Instead</dt><dd>${esc(x.fix)}</dd></dl></div>`;
}
function composer(k){
  const i = k.lastIndexOf(":");
  return `<div class="comp" id="comp"><span class="note" style="margin:0 0 8px;display:block">${esc(k.slice(0,i))}:${esc(k.slice(i+1))}</span>`
    + `<label>Title</label><input type="text" id="c_title" placeholder="one phrase — what is wrong">`
    + `<label>What</label><textarea id="c_what" placeholder="what is wrong here"></textarea>`
    + `<label>Why it matters</label><textarea id="c_why" placeholder="what it costs in production"></textarea>`
    + `<label>Instead</label><textarea id="c_fix" placeholder="what you would do — name the fix"></textarea>`
    + `<p class="note">All three are required. ./check reads them.</p>`
    + `<div class="btns"><button class="p" id="c_save">Add comment</button>`
    + `<button class="s" id="c_cancel">Cancel</button></div></div>`;
}
function reviewMd(c){
  let s = (c.title ? `# ${c.title}\n\n` : "") + `Verdict: ${REV.verdict}\n\n---\n`;
  for (const x of REV.comments)
    s += `\n## ${x.file}:${x.line} — ${x.title || "(untitled)"}\n`
       + `**What.** ${x.what}\n**Why it matters.** ${x.why}\n**Instead.** ${x.fix}\n`;
  return s;
}
let saveT;
function saveReview(c){
  commit({kind:"review-state", card:c.id, verdict:REV.verdict, comments:REV.comments});
  const el = document.getElementById("save");
  if (el){ el.textContent = (ST.writable[0] || "") + " — saving…"; el.className = "save"; }
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if (!(ST.writable || []).length) return;
    try {
      const r = await api("/file", {path: ST.writable[0], content: reviewMd(c)});
      if (el){ el.textContent = ST.writable[0] + (r.ok ? " — saved" : " — NOT writable"); el.className = "save" + (r.ok ? " on" : ""); }
    } catch { if (el){ el.textContent = ST.writable[0] + " — save failed"; el.className = "save"; } }
  }, 500);
}

const BODY = {choice:cChoice, quiz:cQuiz, kata:cKata, review:cReview, explain:cExplain, log:cLog, tomorrow:cTomorrow, prep:cTomorrow};

function result(c){
  if (c.kind === "choice"){ const p = get(c.id,"choice"); return p ? (p===c.right?"hit":"miss") : "—"; }
  if (c.kind === "quiz"){ const s = quizScore(c); return s.done ? `${s.n}/${s.of}` : "—"; }
  if (c.kind === "kata")  return lastOut ? (lastOut.rc === 0 ? "green" : "red") : "—";
  if (c.kind === "review") return REV.comments.length + " comment" + (REV.comments.length===1?"":"s");
  if (c.kind === "explain") return get(c.id,"conf") ? "confidence " + get(c.id,"conf") : "—";
  return c.done_label || "—";
}
const resClass = (c, r) => (c.kind === "kata" ? (r === "green" ? "ok" : r === "red" ? "bad" : "") : c.kind === "choice" ? (r === "hit" ? "ok" : r === "miss" ? "bad" : "") : "");

/* ── render ─────────────────────────────────────────────────────────────── */
function render(){
  const cards = ST.cards || [];
  const active = cards.findIndex(c => c.id === ST.phase);
  let h = "";
  if (ST.eyebrow) h += `<p class="eyebrow">${esc(ST.eyebrow)}</p>`;
  if (ST.headline) h += `<h2 class="title">${esc(ST.headline)}</h2>`;
  if (ST.lede) h += `<p class="lede">${esc(ST.lede)}</p>`;

  /* the lesson: full when outside the box, collapsed strips inside it */
  if (ST.lesson && LESSON.md){
    const P = lessonParts(LESSON.md);
    const rail = ST.outside_box ? "tonight · about ten minutes" : (ST.lesson_read_by || "read the night before");
    if (!ST.headline && P.title) h += `<h2 class="title">${inline(P.title)}</h2>`;
    if (!ST.lede && P.lede) h += `<div class="lede">${md(P.lede)}</div>`;
    P.sections.forEach((s, i) => {
      const key = "L" + i, open = ST.outside_box || lessonOpen[key];
      const opts = /^by the end/i.test(s.name) ? {outcomes:true} : /^go deeper/i.test(s.name) ? {resources:true} : {};
      if (open) h += `<section><p class="rail"><span class="side-of">${esc(rail)}</span></p><h3>${inline(s.name)}</h3><div class="prose">${md(s.body, opts)}</div></section>`;
      else h += `<section class="strip" data-lesson="${key}"><p class="rail"><span class="side-of">${esc(rail)}</span></p><h3>${inline(s.name)}<span class="res">open</span></h3></section>`;
    });
  } else if (ST.lesson && LESSON.error){
    h += `<section><p class="rail"><span class="side-of">lesson</span></p><p class="empty">${esc(LESSON.error)} — ${esc(ST.lesson)}</p></section>`;
  }

  cards.forEach((c, i) => {
    const isOpen = c.id === ST.phase || c.id === manualOpen;
    const past = active < 0 ? false : i < active;
    const sideOf = c.side === "after" ? "after the box" : c.side === "before" ? "before the box" : "inside the box";
    const budget = c.budget ? ` · ${esc(c.budget)}${/\d$/.test(String(c.budget)) ? " min" : ""}` : "";
    const rail = `<p class="rail"><span class="side-of ${c.side === "after" || c.side === "before" ? "" : "in"}">${sideOf}${budget}</span></p>`;
    if (isOpen){
      const fn = BODY[c.kind] || (() => `<p class="empty">unknown card kind: ${esc(c.kind)}</p>`);
      h += `<section id="sec-${esc(c.id)}">${rail}<h3>${esc(c.name || c.kind)}${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ""}</h3>${fn(c)}</section>`;
    } else if (past){
      const r = result(c);
      h += `<section class="strip" data-open="${esc(c.id)}">${rail}<h3>${esc(c.name || c.kind)}${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ""}<span class="res ${resClass(c, r)}">${esc(r)}</span></h3></section>`;
    } else {
      h += `<section class="later" data-open="${esc(c.id)}" style="cursor:pointer">${rail}<h3>${esc(c.name || c.kind)}${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ""}</h3></section>`;
    }
  });
  document.getElementById("doc").innerHTML = h || '<p class="empty">Waiting for a session…</p>';
  if (lastOut) showOut(lastOut);
}

function showOut(r){
  lastOut = r;
  const html = r.rc === 0 ? `<span class="ok">${esc(r.out || "PASS")}</span>` : `<span class="bad">${esc(r.out || "FAIL")}</span>`;
  document.getElementById("out").innerHTML = html;
  const k = document.getElementById("kout"); if (k) k.innerHTML = html;
}

/* ── poll ───────────────────────────────────────────────────────────────── */
async function poll(){
  try {
    const s = await api("/state");
    document.getElementById("offline").hidden = true;
    if (s.v !== ST.v){
      const lessonChanged = s.lesson !== ST.lesson || s.outside_box !== ST.outside_box;
      ST = s;
      if (ST.lesson){ try { LESSON = await api("/lesson"); } catch { LESSON = {path: ST.lesson, md: "", error: "lesson unavailable"}; } }
      else LESSON = {path:null, md:""};
      if (lessonChanged && ST.outside_box && ST.lesson) commit({kind:"lesson-open"});
      replay(await api("/events"));
      side(); hud(); render();
    }
  } catch { document.getElementById("offline").hidden = false; }
}
setInterval(poll, 2000);

/* ── events ─────────────────────────────────────────────────────────────── */
const card = id => (ST.cards || []).find(c => c.id === id);

async function runCheck(){
  document.getElementById("out").textContent = "running…";
  try { showOut(await api("/check", {})); } catch { document.getElementById("out").textContent = "check failed to run"; }
  render();
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  const radio = e.target.closest('input[name=verdict]');
  if (radio){
    const rc = (ST.cards||[]).find(c => c.kind === "review");
    REV.verdict = radio.value; if (rc) saveReview(rc);
    return;
  }
  if (!b){
    const strip = e.target.closest("section[data-lesson]");
    if (strip){ lessonOpen[strip.dataset.lesson] = true; return render(); }
    const sec = e.target.closest("section[data-open]");
    if (sec && !e.target.closest("a")){ manualOpen = manualOpen === sec.dataset.open ? null : sec.dataset.open; return render(); }
    return;
  }

  if (b.dataset.pick){
    const [id, slot, l] = b.dataset.pick.split("|");
    const c = card(id); if (!c) return;
    set(id, slot, l);
    if (slot.startsWith("q") && c.kind === "quiz"){
      const i = +slot.slice(1); const it = (c.items || [])[i-1] || {};
      commit({kind:"quiz", card:id, item:i, pick:l, hit: l === it.right});
    } else {
      commit({kind:"choice", card:id, pick:l, hit: l === c.right});
    }
    return render();
  }
  if (b.dataset.conf){
    const [id, n] = b.dataset.conf.split("|");
    const t = document.getElementById("ans");
    if (t){ set(id, "text", t.value); commit({kind:"explain-text", card:id, text:t.value}); }
    set(id, "conf", +n); commit({kind:"confidence", card:id, value:+n});
    return render();
  }
  if (b.dataset.label){
    const [id, which, val] = b.dataset.label.split("|");
    set(id, "label:" + which, val); commit({kind:"label", card:id, which, value:val});
    return render();
  }
  if (b.id === "runcheck" || b.dataset.check) return runCheck();

  /* review card */
  const rc = (ST.cards || []).find(c => c.kind === "review");
  if (!rc) return;
  if (b.dataset.del){
    REV.comments = REV.comments.filter(x => x.id != b.dataset.del);
    saveReview(rc); return render();
  }
  if (b.dataset.go){
    document.querySelector(`.ln[data-k="${CSS.escape(b.dataset.go)}"]`)?.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  if (b.id === "c_cancel"){ openAt = null; return render(); }
  if (b.id === "c_save"){
    const v = i => (document.getElementById(i) || {}).value || "";
    const i = openAt.lastIndexOf(":");
    REV.comments.push({id: REV.next++, file: openAt.slice(0,i), line: +openAt.slice(i+1),
      title: v("c_title"), what: v("c_what"), why: v("c_why"), fix: v("c_fix")});
    openAt = null; saveReview(rc); return render();
  }
  if (b.dataset.k){ openAt = openAt === b.dataset.k ? null : b.dataset.k; return render(); }
});

document.addEventListener("click", e => {
  const row = e.target.closest(".ln");
  if (!row || !row.dataset.k || e.target.closest(".comp") || e.target.closest("button")) return;
  openAt = openAt === row.dataset.k ? null : row.dataset.k;
  render();
  document.getElementById("comp")?.scrollIntoView({block:"center", behavior:"smooth"});
});

document.addEventListener("blur", e => {
  if (e.target.id === "ans"){
    const id = e.target.dataset.card;
    set(id, "text", e.target.value);
    commit({kind:"explain-text", card:id, text:e.target.value});
  }
}, true);

side(); hud(); poll();
</script>
</body>
</html>
